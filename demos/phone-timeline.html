<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Generation Comparison by Brand</title>
<style>
:root{--primary:#4f46e5;--primary-light:#6366f1;--primary-dark:#3730a3;--accent:#f59e0b;--danger:#ef4444;--success:#10b981;
--bg-grad:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#111827 100%);--card-bg:#fff;--border:#e2e8f0;--text-primary:#1e293b;--text-secondary:#64748b;
--radius-lg:16px;--radius-md:10px;--radius-sm:6px;--shadow-sm:0 2px 6px rgba(15,23,42,.08);--shadow-md:0 8px 22px rgba(15,23,42,.12);
--font-sans:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--bg-grad);background-attachment:fixed;color:#e2e8f0;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{margin:0;padding:18px 28px;font-size:20px;font-weight:800;background:linear-gradient(120deg,#0f172a,#312e81 55%,#3730a3);color:#fff;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
h1 .nav-link{font-size:13px;font-weight:600;padding:8px 16px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;text-decoration:none}
h1 .nav-link:hover{background:var(--primary-light);border-color:var(--primary-light)}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 28px;background:rgba(255,255,255,.75);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(6px)}
#brand-tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
.gc-tab{font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.gc-tab:hover{border-color:var(--primary-light);color:var(--primary-dark)}
.gc-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-sm)}
#gc-search{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);outline:none;min-width:180px}
#gc-search:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
#gc-result-count{font-size:12.5px;font-weight:700;color:var(--text-secondary);white-space:nowrap}
#gc-note{max-width:1180px;margin:0 auto;padding:14px 28px 0;font-size:12px;color:#94a3b8}
#gc-list{padding:20px 28px 60px;display:flex;flex-direction:column;gap:16px;max-width:1180px;margin:0 auto}
.gc-empty-state{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px}
.gc-card{background:var(--card-bg);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.gc-card-top{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.gc-card-top{grid-template-columns:1fr}}
.gc-side{padding:16px 18px}
.gc-side:first-child{border-right:1px solid var(--border);background:#f5f7ff}
.gc-side-label{font-size:11.5px;font-weight:800;color:var(--primary-dark);letter-spacing:.3px;margin-bottom:8px}
.gc-side:last-child .gc-side-label{color:var(--text-secondary)}
.gc-side-row{display:flex;align-items:center;gap:12px}
.gc-thumb{width:56px;height:56px;flex-shrink:0;border-radius:var(--radius-md);background:linear-gradient(135deg,#eef1f8,#e3e8f2);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.gc-thumb svg{width:26px;height:26px;opacity:.55}
.gc-name{font-size:14.5px;font-weight:700}
.gc-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.gc-empty{font-size:12.5px;color:#94a3b8;padding:10px 0 2px}
.gc-table{width:100%;border-collapse:collapse;font-size:12.5px}
.gc-table th{background:#f8fafc;color:var(--text-secondary);font-weight:700;text-align:left;padding:8px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
.gc-table td{padding:7px 14px;border-bottom:1px solid #f1f3f9;white-space:nowrap}
.gc-table tr:last-child td{border-bottom:none}
.gap-pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800}
.gap-up{background:rgba(239,68,68,.12);color:#b91c1c}
.gap-down{background:rgba(16,185,129,.14);color:#047857}
.gap-flat{background:rgba(100,116,139,.12);color:#475569}
.gap-na{background:rgba(100,116,139,.08);color:#94a3b8}
.tbl-wrap{overflow-x:auto}
</style>
</head>
<body>

<h1>
  <span>Phone Generation Comparison by Brand</span>
  <a class="nav-link" href="../../en/index.html">← Back to portfolio</a>
</h1>

<div id="toolbar">
  <div id="brand-tabs"></div>
  <input type="text" id="gc-search" placeholder="Search model name…">
  <span id="gc-result-count"></span>
</div>
<div id="gc-note">Note: all brands, models, chips, dates, and prices in this demo are fictional and only illustrate the generation-comparison feature; they are unrelated to any real product or company.</div>

<div id="gc-list"></div>

<script>
// ---- Built-in data: newName/prevName are the new and previous generations; rows compare matching storage tiers ----
var genCompareData = {"A": [{"newName": "A2 Pro", "newLaunch": "2025-03-18", "newSoc": "Chip X2", "prevName": "A1 Pro", "prevLaunch": "2024-03-12", "prevSoc": "Chip X1", "rows": [{"newStorage": "12GB+256GB", "newPrice": 4299, "prevStorage": "12GB+256GB", "prevPrice": 3999, "gap": 300}, {"newStorage": "16GB+512GB", "newPrice": 4899, "prevStorage": "16GB+512GB", "prevPrice": 4599, "gap": 300}]}, {"newName": "A2", "newLaunch": "2025-03-18", "newSoc": "Chip Y2", "prevName": "A1", "prevLaunch": "2024-03-12", "prevSoc": "Chip Y1", "rows": [{"newStorage": "8GB+256GB", "newPrice": 2999, "prevStorage": "8GB+256GB", "prevPrice": 2999, "gap": 0}, {"newStorage": "12GB+512GB", "newPrice": 3499, "prevStorage": "12GB+512GB", "prevPrice": 3399, "gap": 100}]}], "B": [{"newName": "B3 Pro", "newLaunch": "2025-09-02", "newSoc": "Chip X2", "prevName": "B2 Pro", "prevLaunch": "2024-09-05", "prevSoc": "Chip X1", "rows": [{"newStorage": "12GB+256GB", "newPrice": 5499, "prevStorage": "12GB+256GB", "prevPrice": 5999, "gap": -500}, {"newStorage": "16GB+512GB", "newPrice": 6299, "prevStorage": "16GB+512GB", "prevPrice": 6799, "gap": -500}]}, {"newName": "B3", "newLaunch": "2025-09-02", "newSoc": "Chip Y2", "prevName": "B2", "prevLaunch": "2024-09-05", "prevSoc": "Chip Y1", "rows": [{"newStorage": "8GB+128GB", "newPrice": 3999, "prevStorage": "8GB+128GB", "prevPrice": 3999, "gap": 0}, {"newStorage": "8GB+256GB", "newPrice": 4499, "prevStorage": "8GB+256GB", "prevPrice": 4499, "gap": 0}]}], "C": [{"newName": "C10", "newLaunch": "2025-06-10", "newSoc": "Chip Z1", "prevName": "C9", "prevLaunch": "2024-06-14", "prevSoc": "Chip Z1", "rows": [{"newStorage": "8GB+256GB", "newPrice": 1999, "prevStorage": "8GB+256GB", "prevPrice": 1899, "gap": 100}, {"newStorage": "12GB+256GB", "newPrice": 2299, "prevStorage": "12GB+256GB", "prevPrice": 2199, "gap": 100}]}, {"newName": "C10 Lite", "newLaunch": "2025-06-10", "newSoc": "Chip Z1", "prevName": null, "prevLaunch": null, "prevSoc": null, "rows": [{"newStorage": "8GB+128GB", "newPrice": 1499, "prevStorage": null, "prevPrice": null, "gap": null}]}], "D": [{"newName": "D5 Ultra", "newLaunch": "2025-02-20", "newSoc": "Chip X2", "prevName": "D4 Ultra", "prevLaunch": "2024-02-22", "prevSoc": "Chip X1", "rows": [{"newStorage": "16GB+512GB", "newPrice": 6499, "prevStorage": "16GB+512GB", "prevPrice": 6499, "gap": 0}]}, {"newName": "D5", "newLaunch": "2025-02-20", "newSoc": "Chip X2", "prevName": "D4", "prevLaunch": "2024-02-22", "prevSoc": "Chip X1", "rows": [{"newStorage": "12GB+256GB", "newPrice": 3899, "prevStorage": "12GB+256GB", "prevPrice": 3599, "gap": 300}, {"newStorage": "16GB+512GB", "newPrice": 4399, "prevStorage": "16GB+512GB", "prevPrice": 4099, "gap": 300}]}], "E": [{"newName": "E7", "newLaunch": "2025-11-05", "newSoc": "Chip Y2", "prevName": "E6", "prevLaunch": "2024-11-08", "prevSoc": "Chip Y1", "rows": [{"newStorage": "8GB+256GB", "newPrice": 2499, "prevStorage": "8GB+256GB", "prevPrice": 2699, "gap": -200}, {"newStorage": "12GB+512GB", "newPrice": 2999, "prevStorage": "12GB+512GB", "prevPrice": 3199, "gap": -200}]}], "F": [{"newName": "F4 Pro", "newLaunch": "2025-08-12", "newSoc": "Chip X2", "prevName": "F3 Pro", "prevLaunch": "2024-08-15", "prevSoc": "Chip X1", "rows": [{"newStorage": "12GB+256GB", "newPrice": 4799, "prevStorage": "12GB+256GB", "prevPrice": 4399, "gap": 400}, {"newStorage": "16GB+512GB", "newPrice": 5399, "prevStorage": "16GB+512GB", "prevPrice": 4799, "gap": 600}]}]};
</script>
<script>
(function () {
  var BRAND_ORDER = ['A','B','C','D','E','F'];
  var BRAND_LABELS = {A:'Brand A',B:'Brand B',C:'Brand C',D:'Brand D',E:'Brand E',F:'Brand F'};
  var tabsEl=document.getElementById('brand-tabs'), listEl=document.getElementById('gc-list');
  var searchInput=document.getElementById('gc-search'), resultCountEl=document.getElementById('gc-result-count');
  var activeBrand=BRAND_ORDER.filter(function(b){return (genCompareData[b]||[]).length>0})[0]||BRAND_ORDER[0];
  var searchTerm='';

  function fmtPrice(p){return (typeof p==='number')?('$'+p.toLocaleString()):'—'}
  function fmtDate(d){return d||'Unknown'}
  function gapPill(g){
    if(typeof g!=='number')return '<span class="gap-pill gap-na">—</span>';
    if(g>0)return '<span class="gap-pill gap-up">↑ Up $'+g.toLocaleString()+'</span>';
    if(g<0)return '<span class="gap-pill gap-down">↓ Down $'+Math.abs(g).toLocaleString()+'</span>';
    return '<span class="gap-pill gap-flat">→ Flat</span>';
  }
  var PHONE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>';

  function buildSide(launch,name,soc,label,emptyLabel){
    var side=document.createElement('div');side.className='gc-side';
    var head=document.createElement('div');head.className='gc-side-label';head.textContent=label;side.appendChild(head);
    if(!name){var e=document.createElement('div');e.className='gc-empty';e.textContent=emptyLabel;side.appendChild(e);return side}
    var row=document.createElement('div');row.className='gc-side-row';
    var th=document.createElement('div');th.className='gc-thumb';th.innerHTML=PHONE_SVG;row.appendChild(th);
    var info=document.createElement('div');
    var n=document.createElement('div');n.className='gc-name';n.textContent=name;
    var m=document.createElement('div');m.className='gc-meta';m.textContent=fmtDate(launch)+' · '+(soc||'SoC not provided');
    info.appendChild(n);info.appendChild(m);row.appendChild(info);side.appendChild(row);return side;
  }
  function buildEntryCard(entry){
    var card=document.createElement('div');card.className='gc-card';
    var top=document.createElement('div');top.className='gc-card-top';
    top.appendChild(buildSide(entry.newLaunch,entry.newName,entry.newSoc,'🆕 New model',''));
    top.appendChild(buildSide(entry.prevLaunch,entry.prevName,entry.prevSoc,'⬅ Previous generation','(No matching previous generation — possibly a brand-new series)'));
    card.appendChild(top);
    if(entry.rows&&entry.rows.length){
      var wrap=document.createElement('div');wrap.className='tbl-wrap';
      var t=document.createElement('table');t.className='gc-table';
      t.innerHTML='<thead><tr><th>New storage</th><th>New price</th><th>Prev. storage</th><th>Prev. price</th><th>Difference</th></tr></thead>';
      var tb=document.createElement('tbody');
      entry.rows.forEach(function(r){
        var tr=document.createElement('tr');
        tr.innerHTML='<td>'+(r.newStorage||'—')+'</td><td>'+fmtPrice(r.newPrice)+'</td><td>'+(r.prevStorage||'—')+'</td><td>'+fmtPrice(r.prevPrice)+'</td><td>'+gapPill(r.gap)+'</td>';
        tb.appendChild(tr);
      });
      t.appendChild(tb);wrap.appendChild(t);card.appendChild(wrap);
    }
    return card;
  }
  function render(){
    var entries=(genCompareData[activeBrand]||[]).filter(function(e){
      if(!searchTerm)return true;
      return ((e.newName||'')+' '+(e.prevName||'')).toLowerCase().indexOf(searchTerm)!==-1;
    });
    listEl.innerHTML='';
    if(!entries.length){listEl.innerHTML='<div class="gc-empty-state">'+(searchTerm?'No models match your search.':'No generation comparison data for this brand yet.')+'</div>'}
    else entries.forEach(function(e){listEl.appendChild(buildEntryCard(e))});
    resultCountEl.textContent=entries.length+(entries.length===1?' comparison':' comparisons');
  }
  function renderTabs(){
    tabsEl.innerHTML='';
    BRAND_ORDER.forEach(function(b){
      var count=(genCompareData[b]||[]).length;
      var btn=document.createElement('button');btn.type='button';
      btn.className='gc-tab'+(b===activeBrand?' active':'');
      btn.textContent=(BRAND_LABELS[b]||b)+' ('+count+')';
      btn.addEventListener('click',function(){activeBrand=b;renderTabs();render()});
      tabsEl.appendChild(btn);
    });
  }
  searchInput.addEventListener('input',function(){searchTerm=searchInput.value.trim().toLowerCase();render()});
  renderTabs();render();
})();
</script>
</body>
</html>
